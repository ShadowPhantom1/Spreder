services:
  - type: web
    name: bhnstock-sms-spreader
    env: node
    plan: free
    buildCommand: npm install && npm run build:render
    startCommand: npm run start:render
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DISABLE_AUTH
        value: false
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        value: admin123456
    healthCheckPath: /api/health
